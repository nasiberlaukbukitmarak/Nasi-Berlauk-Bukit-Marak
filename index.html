<title>Nasi Berlauk Bukit Marak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: banana-leaf green masthead, menu grid on the left, sticky order panel on the right (stacked on phones). */
:root{
  --bg:#f6f7f1; --surface:#ffffff; --fg:#1d2a1f; --muted:#5d6b5f; --line:#dfe4d6;
  --leaf:#1f4d36; --leaf-fg:#f6f7f1; --kunyit:#e8a317; --kunyit-fg:#2a1d00; --sambal:#c2371f;
  --ok:#1f7a4a; --chip:#eaeedf;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a14; --surface:#1a251d; --fg:#eef2e6; --muted:#a2b0a3; --line:#2b3a2f;
  --leaf:#0f2a1c; --leaf-fg:#eef2e6; --kunyit:#f0b02e; --kunyit-fg:#2a1d00; --sambal:#ef6a52;
  --ok:#59c18a; --chip:#223027; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1a251d; --fg:#eef2e6; --muted:#a2b0a3; --line:#2b3a2f;
  --leaf:#0f2a1c; --leaf-fg:#eef2e6; --kunyit:#f0b02e; --kunyit-fg:#2a1d00; --sambal:#ef6a52;
  --ok:#59c18a; --chip:#223027; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kunyit);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--leaf);color:var(--leaf-fg)}
header.top .wrap{padding-block:8px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;display:flex;align-items:center;gap:10px;min-width:0}.bn{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.15}.tagl{font-family:var(--body);font-weight:500;font-size:.85rem;letter-spacing:0;color:var(--kunyit)}.brand .logo{height:56px;width:auto;flex:none}
.tools{display:flex;gap:8px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--leaf-fg) 40%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--leaf-fg);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--kunyit);color:var(--kunyit-fg)}
.hero{background:var(--leaf);color:var(--leaf-fg);padding-block:18px 40px}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--kunyit)}
.hero p{max-width:46ch;margin:14px 0 0;color:color-mix(in srgb,var(--leaf-fg) 85%,transparent)}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed color-mix(in srgb,var(--leaf-fg) 35%,transparent);padding-bottom:8px;font-size:.95rem}
.facts b{color:var(--kunyit);font-weight:700;text-align:right}

main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-block:28px 64px;align-items:start}
.sec-title{font-size:1.5rem;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-fg);border-color:var(--leaf)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .swatch{height:76px;border-radius:6px;display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--display);font-weight:800;color:#fff;font-size:1.05rem;background:var(--c)}
.item h3{font-size:1.1rem}
.item p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);border-radius:4px;padding:2px 6px;color:var(--muted)}
.tag.hot{background:var(--sambal);color:#fff}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:1.1rem}
.qty button.add{background:var(--kunyit);border-color:var(--kunyit);color:var(--kunyit-fg)}
.qty span{min-width:1.6ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.btn-add{border:0;background:var(--kunyit);color:var(--kunyit-fg);font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer}

aside.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:12px;min-width:0}
aside h2{font-size:1.35rem;margin-bottom:12px}
.step{margin:0 0 6px;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cart{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
.cart li{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.cart .n{min-width:0}
.empty{color:var(--muted);font-size:.95rem;padding:8px 0}
.totals{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:grid;gap:4px}
.totals .row{font-variant-numeric:tabular-nums}
.totals .grand{font-weight:800;font-size:1.15rem;font-family:var(--display)}
fieldset{border:0;padding:0;margin:14px 0 0;min-width:0}
legend{padding:0}
label.f{display:grid;gap:3px;margin-top:10px;font-size:.88rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--fg)}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--leaf);box-shadow:0 0 0 2px var(--kunyit)}
.opt input{margin-top:4px;accent-color:var(--leaf)}
.opt small{display:block;color:var(--muted)}
.err{color:var(--sambal);font-size:.88rem;margin:8px 0 0;min-height:1.2em}
.go{width:100%;margin-top:12px;border:0;border-radius:10px;padding:15px;background:var(--kunyit);color:var(--kunyit-fg);font-weight:800;font-family:var(--display);font-size:1.1rem;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--kunyit) 60%,#000)}
.go:active{transform:translateY(2px);box-shadow:none}
.go:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.done{background:var(--chip);border-radius:10px;padding:14px;margin-top:12px}
.done h3{font-size:1.15rem;color:var(--ok);margin-bottom:6px}
.paybox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 12px}
.paybox h3{font-size:1.05rem;margin-bottom:8px;color:var(--fg)}
.paybox .qr{display:block;width:200px;max-width:100%;aspect-ratio:1;margin:0 auto 10px;border-radius:8px;object-fit:contain;background:#fff}
.paybox .qr.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);background:var(--bg);color:var(--muted);padding:12px;font-size:.9rem}
.paybox .amt{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.paybox .amt b{text-align:right}
.paybox ol{margin:10px 0 0;padding-left:20px;font-size:.9rem;color:var(--muted)}
.done pre{white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:.88rem;margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.done .acts{display:flex;gap:8px;flex-wrap:wrap}
.done .acts a,.done .acts button{border:1px solid var(--leaf);background:none;color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;font-size:.9rem}
footer{background:var(--leaf);color:var(--leaf-fg);padding-block:22px;font-size:.9rem}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  main.wrap{grid-template-columns:minmax(0,1fr)}
  aside.panel{position:static}
}
.two>*,label.f,.opt,.opt>span{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:42px;text-align:left}
.linkbtn{background:none;border:0;padding:0;color:var(--leaf);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
:root[data-theme="dark"] .linkbtn{color:var(--kunyit)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .linkbtn{color:var(--kunyit)}}
.wafab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;background:#157a42;color:#fff;font-weight:700;text-decoration:none;border-radius:999px;padding:12px 18px;min-height:48px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.wafab svg{width:22px;height:22px;flex:none}
@media (max-width:900px){.wafab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.how{padding-block:28px 0}
.how ol{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;counter-reset:s}
.how li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 14px 58px;position:relative;min-width:0;display:flex;flex-direction:column;gap:2px}
.how li::before{content:counter(s);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--kunyit);color:var(--kunyit-fg);font:800 1rem var(--display);display:flex;align-items:center;justify-content:center}
.how b{font-family:var(--display);font-size:1.05rem}
.how li span{color:var(--muted);font-size:.92rem}
.locs{padding-block:8px 56px}
.locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.loc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.loc h3{font-size:1.1rem}
.loc a{color:var(--leaf);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:24px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .loc a{color:var(--kunyit)}}
:root[data-theme="dark"] .loc a{color:var(--kunyit)}
.loca{margin:-4px 0 0;color:var(--muted);font-size:.92rem}
.locnote{margin:14px 0 0}
.locnote a{color:var(--leaf);font-weight:700}
@media (max-width:900px){footer{padding-bottom:88px}}
.btn-add:disabled{background:var(--chip);color:var(--muted);cursor:not-allowed}
.cartbar{display:none}
@media (max-width:900px){
  main.wrap{padding-bottom:96px}
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:0;background:var(--kunyit);color:var(--kunyit-fg);font-weight:700;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:pointer;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
  .item .btn-add,.qty button{min-height:44px}
  .qty button{width:44px;height:44px}
  .opt{padding:12px}
  .cats button{min-height:40px}
}
@media (max-width:560px){.menu{grid-template-columns:1fr}.hero h1{font-size:2.4rem}}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

var lang="ms", cat="all", cart={}, cur="";
var $=function(s){return document.querySelector(s)};
var rm=function(n){return "RM"+n.toFixed(2)};
try{var sv=localStorage.getItem("nbm-lang"); if(sv==="en"||sv==="ms") lang=sv}catch(e){}

function t(k){return T[lang][k]}
function applyI18n(){
  document.documentElement.lang=lang==="ms"?"ms":"en";
  document.querySelectorAll("[data-i]").forEach(function(el){el.innerHTML=t(el.dataset.i)});
  $("#l-ms").setAttribute("aria-pressed",lang==="ms"); $("#l-en").setAttribute("aria-pressed",lang==="en");
  renderCats(); renderMenu(); renderPays(); renderCart(); renderStates(); updateMode(); updateCut(); renderLocs(); renderFab();
}
function renderCats(){
  $("#cats").innerHTML=Object.keys(CATS).map(function(k){return '<button type="button" data-c="'+k+'" aria-pressed="'+(k===cat)+'">'+CATS[k][lang]+'</button>'}).join("");
}
function renderMenu(){
  $("#menu").innerHTML=MENU.filter(function(m){return cat==="all"||m.cat===cat}).map(function(m){
    var q=cart[m.id]||0;
    var tag=m.tag?'<span class="tag hot">'+(lang==="ms"?"Paling laris":"Best seller")+'</span>':'<span class="tag">'+CATS[m.cat][lang]+'</span>';
    var ctl=q?'<div class="qty"><button type="button" data-d="-1" data-id="'+m.id+'" aria-label="'+t("remove")+': '+m[lang]+'">-</button><span aria-live="polite">'+q+'</span><button type="button" class="add" data-d="1" data-id="'+m.id+'" aria-label="'+t("plus")+': '+m[lang]+'">+</button></div>'
      :'<button type="button" class="btn-add" data-d="1" data-id="'+m.id+'">'+t("add")+'</button>';
    if(CONFIG.soldOut.indexOf(m.id)>-1) ctl='<button type="button" class="btn-add" disabled>'+t("soldOut")+'</button>';
    return '<article class="item"><div class="swatch" style="--c:'+m.c+'">'+m[lang]+'</div><div class="row"><h3>'+m[lang]+'</h3>'+tag+'</div><p>'+m["d_"+lang]+'</p><div class="row"><span class="price">'+rm(m.p)+'</span>'+ctl+'</div></article>';
  }).join("");
}
function mode(){return document.querySelector('input[name="mode"]:checked').value}
function calc(){
  var sub=0; MENU.forEach(function(m){sub+=(cart[m.id]||0)*m.p});
  var qty=0; MENU.forEach(function(m){qty+=(cart[m.id]||0)});
  var outside=$("#state").value!=="Kelantan";
  var fee=0;
  if(mode()==="deliver"&&sub>0){fee=outside?qty*CONFIG.outsideKelantanPerPack:(sub<CONFIG.freeDeliveryFrom?CONFIG.deliveryFee:0)}
  return {sub:sub,fee:fee,total:sub+fee};
}
function renderCart(){
  var lines=MENU.filter(function(m){return cart[m.id]});
  $("#cart").innerHTML=lines.length?lines.map(function(m){return '<li><span class="n">'+cart[m.id]+' x '+m[lang]+'</span><span class="price">'+rm(cart[m.id]*m.p)+'</span></li>'}).join(""):'<li class="empty">'+t("empty")+'</li>';
  var c=calc();
  var feeTxt=mode()==="deliver"?(c.fee?rm(c.fee):t("free")):rm(0);
  $("#totals").innerHTML='<div class="row"><span>'+t("subtotal")+'</span><span>'+rm(c.sub)+'</span></div><div class="row"><span>'+t("fee")+'</span><span>'+(c.sub?feeTxt:rm(0))+'</span></div><div class="row grand"><span>'+t("total")+'</span><span>'+rm(c.total)+'</span></div>';
  var nq=0; MENU.forEach(function(m){nq+=(cart[m.id]||0)});
  $("#cbn").textContent=nq+" "+t("itemWord"); $("#cbt").textContent=rm(c.total); $("#cartbar").hidden=!nq;
  updateGo();
}
function renderPays(){
  var chosen=document.querySelector('input[name="pay"]:checked'); var keep=chosen?chosen.value:"duitnow";
  $("#pays").innerHTML=PAYS.map(function(p){return '<label class="opt"><input type="radio" name="pay" value="'+p.id+'"'+(p.id===keep?" checked":"")+'><span><b>'+p[lang]+'</b><small>'+p["s_"+lang]+'</small></span></label>'}).join("");
  updateGo();
}
function renderStates(){
  var v=$("#state").value;
  $("#state").innerHTML=STATES.map(function(s){return '<option>'+s+'</option>'}).join(""); $("#state").value=v||"Kelantan";
}
function updateMode(){ $("#addr").hidden=mode()!=="deliver"; renderCart(); }
function updateGo(){
  var p=document.querySelector('input[name="pay"]:checked');
  $("#go").textContent=(p&&p.value==="cod")?t("go"):t("goPay");
}
function renderFab(){
  var f=$("#wafab"); if(!CONFIG.whatsapp){f.hidden=true;return}
  f.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(t("waMsg")); $("#wat").textContent=t("waAsk"); f.hidden=false;
}
var CUST=["name","phone","addr1","addr2","postcode","city"];
function loadCust(){
  try{var o=JSON.parse(localStorage.getItem("nbm-cust")||"null");
    if(o){CUST.forEach(function(id){if(o[id])$("#"+id).value=o[id]}); if(o.state)$("#state").value=o.state; $("#saved").hidden=false}
  }catch(e){}
}
function saveCust(){
  try{var o={}; CUST.concat(["state"]).forEach(function(id){o[id]=$("#"+id).value.trim()}); localStorage.setItem("nbm-cust",JSON.stringify(o)); $("#saved").hidden=false}catch(e){}
}
function forgetCust(){
  try{localStorage.removeItem("nbm-cust")}catch(e){}
  CUST.forEach(function(id){$("#"+id).value=""}); $("#saved").hidden=true; renderCart();
}
function fetchStatus(){
  if(!CONFIG.sheetUrl) return;
  try{fetch(CONFIG.sheetUrl).then(function(r){return r.json()}).then(function(j){
    if(j&&Array.isArray(j.soldOut)){CONFIG.soldOut=j.soldOut; j.soldOut.forEach(function(id){delete cart[id]}); renderMenu(); renderCart()}
  }).catch(function(){})}catch(e){}
}
var LOCS=[
  {n:"Lembah Sireh",u:"https://maps.app.goo.gl/5gC17prpX1nXd9k4A?g_st=iwb",t:"tback"},
  {n:"Tunjong",u:"https://maps.app.goo.gl/LfxwQtnXe1csKWuc8?g_st=iwb",t:"tback"},
  {n:"Taman Bendahara",u:"https://maps.app.goo.gl/B5gPvLB3PghkamBJ8?g_st=ic",t:"troad"},
  {n:"Jelawat",u:"https://maps.app.goo.gl/BCgz5KwmaZqhapjg9?g_st=ic",t:"troad"},
  {n:"Mydin Tunjong",u:"https://maps.app.goo.gl/8NYWGFYyxtjdDdZN9?g_st=ic",t:"troad"},
  {n:"Makey Pagi",a:"Bandar Kota Bharu",u:"https://maps.app.goo.gl/aSRjqZY3nh1t8eHK6?g_st=ic",t:"tshop"}
];
function renderLocs(){
  $("#locgrid").innerHTML=LOCS.map(function(l){return '<article class="loc"><span class="tag">'+t(l.t)+'</span><h3>'+l.n+'</h3>'+(l.a?'<p class="loca">'+l.a+'</p>':"")+'<a href="'+l.u+'" target="_blank" rel="noopener">'+t("locMap")+'</a></article>'}).join("");
  $("#locnote").innerHTML=CONFIG.whatsapp?'<a href="https://wa.me/'+CONFIG.whatsapp+'" target="_blank" rel="noopener">'+t("locAsk")+'</a>':"";
}
function myNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kuala_Lumpur"}))}
function fmt(d){var m=("0"+(d.getMonth()+1)).slice(-2),dd=("0"+d.getDate()).slice(-2);return d.getFullYear()+"-"+m+"-"+dd}
function todayStr(){return fmt(myNow())}
function pastCutoff(){var n=myNow(),p=CONFIG.cutoff.split(":");return n.getHours()*60+n.getMinutes()>=(+p[0])*60+(+p[1])}
function minDate(){var d=myNow();if(pastCutoff())d.setDate(d.getDate()+1);return fmt(d)}
function updateCut(){var n=$("#cutnote");n.textContent=pastCutoff()?t("cutPast"):t("cutNote").replace("{t}",CONFIG.cutoff)}

document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.c){cat=b.dataset.c;renderCats();renderMenu();return}
  if(b.dataset.id){var id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.d));if(!cart[id])delete cart[id];renderMenu();renderCart();var f=document.querySelector('[data-id="'+id+'"]');if(f)f.focus()}
});
$("#l-ms").onclick=function(){lang="ms";try{localStorage.setItem("nbm-lang",lang)}catch(e){}applyI18n()};
$("#l-en").onclick=function(){lang="en";try{localStorage.setItem("nbm-lang",lang)}catch(e){}applyI18n()};
document.querySelectorAll('input[name="mode"]').forEach(function(r){r.addEventListener("change",updateMode)});
document.addEventListener("change",function(e){if(e.target.name==="pay")updateGo()});
$("#state").addEventListener("change",renderCart);

$("#form").addEventListener("submit",function(e){
  e.preventDefault();
  var err=function(k,extra){$("#err").textContent=t(k)+(extra||"");return false};
  var c=calc(), dl=mode()==="deliver";
  if(!c.sub) return err("eCart");
  if(MENU.some(function(m){return cart[m.id]&&CONFIG.soldOut.indexOf(m.id)>-1})) return err("eSold");
  if(c.sub<CONFIG.minOrder) return err("eMin",CONFIG.minOrder.toFixed(2));
  if(!$("#name").value.trim()) return err("eName");
  if(!/^(\+?60|0)1\d{8,9}$|^0\d{8,9}$/.test($("#phone").value.replace(/[\s-]/g,""))) return err("ePhone");
  if(dl&&(!$("#addr1").value.trim()||!/^\d{5}$/.test($("#postcode").value.trim())||!$("#city").value.trim())) return err("eAddr");
  if(!$("#date").value||$("#date").value<minDate()) return err("eDate");
  $("#err").textContent="";
  var pay=document.querySelector('input[name="pay"]:checked').value;
  var payObj=PAYS.filter(function(p){return p.id===pay})[0];
  var no="NBM-"+Date.now().toString(36).toUpperCase().slice(-6);
  var L=[ "Tempahan / Order "+no, "" ];
  MENU.forEach(function(m){if(cart[m.id])L.push(cart[m.id]+" x "+m.ms+" ("+m.en+") - "+rm(cart[m.id]*m.p))});
  L.push("", t("subtotal")+": "+rm(c.sub), t("fee")+": "+rm(c.fee), t("total")+": "+rm(c.total), "");
  L.push((dl?t("deliver"):t("pickup")));
  L.push($("#name").value.trim()+" / "+$("#phone").value.trim());
  if(dl) L.push([$("#addr1").value.trim(),$("#addr2").value.trim(),$("#postcode").value.trim()+" "+$("#city").value.trim(),$("#state").value].filter(Boolean).join(", "));
  L.push($("#date").value+" "+$("#time").value);
  if($("#notes").value.trim()) L.push(t("notes").split(" (")[0]+": "+$("#notes").value.trim());
  L.push(payObj[lang]+" - "+(pay==="cod"?t("status_cod"):t("status_paid")));
  cur=L.join("\n");
  if(CONFIG.sheetUrl&&!$("#hp").value){try{fetch(CONFIG.sheetUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({k:CONFIG.token,hp:"",order:no,created:new Date().toISOString(),name:$("#name").value.trim(),phone:$("#phone").value.trim(),mode:dl?"hantar":"ambil sendiri",address:dl?[$("#addr1").value.trim(),$("#addr2").value.trim(),$("#postcode").value.trim()+" "+$("#city").value.trim(),$("#state").value].filter(Boolean).join(", "):"",date:$("#date").value,slot:$("#time").value,items:MENU.filter(function(m){return cart[m.id]}).map(function(m){return cart[m.id]+" x "+m.ms}).join("; "),subtotal:c.sub,fee:c.fee,total:c.total,notes:$("#notes").value.trim(),summary:cur})}).catch(function(){})}catch(x){}}
  saveCust();
  var wa=CONFIG.whatsapp?'<a href="https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(cur)+'" target="_blank" rel="noopener">'+t("wa")+'</a>':"";
  var payBox="";
  if(pay==="duitnow"){
    var qr=CONFIG.qr?'<img src="'+CONFIG.qr+'" alt="'+t("qrAlt")+'" class="qr">':'<div class="qr ph">'+t("noQr")+'</div>';
    payBox='<div class="paybox"><h3>'+t("payH")+'</h3>'+qr+'<div class="amt"><span>'+t("payAmt")+'</span><b>'+rm(c.total)+'</b></div><div class="amt"><span>'+t("payTo")+'</span><b>'+CONFIG.payName+'</b></div><ol><li>'+t("payS1")+'</li><li>'+t("payS2")+'</li><li>'+t("payS3")+'</li></ol><div class="amt"><span>'+t("rcpt")+'</span><b>WhatsApp +'+CONFIG.whatsapp+'</b></div></div>';
  }
  $("#result").innerHTML='<div class="done"><h3>'+t("doneH")+" "+no+'</h3>'+payBox+'<div>'+t("doneP")+'</div><pre id="sum"></pre><div class="acts"><button type="button" id="cp">'+t("copy")+'</button>'+wa+'<button type="button" id="nw">'+t("newo")+'</button></div></div>';
  $("#sum").textContent=cur;
  $("#cp").onclick=function(){var b=this;function ok(){b.textContent=t("copied")}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cur).then(ok,function(){var r=document.createRange();r.selectNodeContents($("#sum"));var s=getSelection();s.removeAllRanges();s.addRange(r)})}
    else{var r=document.createRange();r.selectNodeContents($("#sum"));var s=getSelection();s.removeAllRanges();s.addRange(r)}};
  $("#nw").onclick=function(){cart={};$("#result").innerHTML="";renderMenu();renderCart()};
  $("#result").scrollIntoView({block:"nearest"});
});

$("#cartbar").onclick=function(){$("#ot").scrollIntoView({behavior:"smooth",block:"start"})};
$("#date").value=minDate(); $("#date").min=minDate();
cart={};
CONFIG.soldOut.forEach(function(id){delete cart[id]});
applyI18n();
loadCust();
$("#forget").onclick=forgetCust;
renderCart();
fetchStatus();
</script>

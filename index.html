<title>Nasi Berlauk Bukit Marak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: banana-leaf green masthead, menu grid on the left, sticky order panel on the right (stacked on phones). */
:root{
  --bg:#f6f7f1; --surface:#ffffff; --fg:#1d2a1f; --muted:#5d6b5f; --line:#dfe4d6;
  --leaf:#1f4d36; --leaf-fg:#f6f7f1; --kunyit:#e8a317; --kunyit-fg:#2a1d00; --sambal:#c2371f;
  --ok:#1f7a4a; --chip:#eaeedf;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a14; --surface:#1a251d; --fg:#eef2e6; --muted:#a2b0a3; --line:#2b3a2f;
  --leaf:#0f2a1c; --leaf-fg:#eef2e6; --kunyit:#f0b02e; --kunyit-fg:#2a1d00; --sambal:#ef6a52;
  --ok:#59c18a; --chip:#223027; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1a251d; --fg:#eef2e6; --muted:#a2b0a3; --line:#2b3a2f;
  --leaf:#0f2a1c; --leaf-fg:#eef2e6; --kunyit:#f0b02e; --kunyit-fg:#2a1d00; --sambal:#ef6a52;
  --ok:#59c18a; --chip:#223027; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kunyit);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--leaf);color:var(--leaf-fg)}
header.top .wrap{padding-block:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em}
.tools{display:flex;gap:8px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--leaf-fg) 40%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--leaf-fg);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--kunyit);color:var(--kunyit-fg)}
.hero{background:var(--leaf);color:var(--leaf-fg);padding-block:18px 40px}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--kunyit)}
.hero p{max-width:46ch;margin:14px 0 0;color:color-mix(in srgb,var(--leaf-fg) 85%,transparent)}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed color-mix(in srgb,var(--leaf-fg) 35%,transparent);padding-bottom:8px;font-size:.95rem}
.facts b{color:var(--kunyit);font-weight:700;text-align:right}

main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-block:28px 64px;align-items:start}
.sec-title{font-size:1.5rem;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-fg);border-color:var(--leaf)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .swatch{height:76px;border-radius:6px;display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--display);font-weight:800;color:#fff;font-size:1.05rem;background:var(--c)}
.item h3{font-size:1.1rem}
.item p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);border-radius:4px;padding:2px 6px;color:var(--muted)}
.tag.hot{background:var(--sambal);color:#fff}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:1.1rem}
.qty button.add{background:var(--kunyit);border-color:var(--kunyit);color:var(--kunyit-fg)}
.qty span{min-width:1.6ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.btn-add{border:0;background:var(--kunyit);color:var(--kunyit-fg);font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer}

aside.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:12px;min-width:0}
aside h2{font-size:1.35rem;margin-bottom:12px}
.step{margin:0 0 6px;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cart{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
.cart li{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.cart .n{min-width:0}
.empty{color:var(--muted);font-size:.95rem;padding:8px 0}
.totals{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:grid;gap:4px}
.totals .row{font-variant-numeric:tabular-nums}
.totals .grand{font-weight:800;font-size:1.15rem;font-family:var(--display)}
fieldset{border:0;padding:0;margin:14px 0 0;min-width:0}
legend{padding:0}
label.f{display:grid;gap:3px;margin-top:10px;font-size:.88rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--fg)}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--leaf);box-shadow:0 0 0 2px var(--kunyit)}
.opt input{margin-top:4px;accent-color:var(--leaf)}
.opt small{display:block;color:var(--muted)}
.err{color:var(--sambal);font-size:.88rem;margin:8px 0 0;min-height:1.2em}
.go{width:100%;margin-top:10px;border:0;border-radius:10px;padding:13px;background:var(--leaf);color:var(--leaf-fg);font-weight:700;font-size:1.05rem;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.done{background:var(--chip);border-radius:10px;padding:14px;margin-top:12px}
.done h3{font-size:1.15rem;color:var(--ok);margin-bottom:6px}
.paybox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 12px}
.paybox h3{font-size:1.05rem;margin-bottom:8px;color:var(--fg)}
.paybox .qr{display:block;width:200px;max-width:100%;aspect-ratio:1;margin:0 auto 10px;border-radius:8px;object-fit:contain;background:#fff}
.paybox .qr.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);background:var(--bg);color:var(--muted);padding:12px;font-size:.9rem}
.paybox .amt{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.paybox .amt b{text-align:right}
.paybox ol{margin:10px 0 0;padding-left:20px;font-size:.9rem;color:var(--muted)}
.done pre{white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:.88rem;margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.done .acts{display:flex;gap:8px;flex-wrap:wrap}
.done .acts a,.done .acts button{border:1px solid var(--leaf);background:none;color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;font-size:.9rem}
footer{background:var(--leaf);color:var(--leaf-fg);padding-block:22px;font-size:.9rem}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  main.wrap{grid-template-columns:minmax(0,1fr)}
  aside.panel{position:static}
}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Nasi Berlauk Bukit Marak</div>
  <div class="tools"><div class="seg" role="group" aria-label="Bahasa / Language">
    <button id="l-ms" aria-pressed="true">BM</button><button id="l-en" aria-pressed="false">EN</button></div></div>
</div></header>

<section class="hero"><div class="wrap">
  <div>
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
  </div>
  <ul class="facts">
    <li><span data-i="f1"></span><b data-i="f1v"></b></li>
    <li><span data-i="f2"></span><b data-i="f2v"></b></li>
    <li><span data-i="f3"></span><b data-i="f3v"></b></li>
    <li><span data-i="f4"></span><b data-i="f4v"></b></li>
  </ul>
</div></section>

<main class="wrap">
  <section aria-labelledby="mt">
    <h2 class="sec-title" id="mt" data-i="menu"></h2>
    <p class="sub" data-i="menuSub"></p>
    <div class="cats" id="cats" hidden></div>
    <div class="menu" id="menu"></div>
  </section>

  <aside class="panel" aria-labelledby="ot">
    <h2 id="ot" data-i="order"></h2>
    <form id="form" novalidate>
      <p class="step" data-i="s1"></p>
      <ul class="cart" id="cart"></ul>
      <div class="totals" id="totals"></div>

      <fieldset>
        <p class="step" data-i="s2"></p>
        <div class="opts">
          <label class="opt"><input type="radio" name="mode" value="deliver" checked><span><b data-i="deliver"></b><small data-i="deliverSub"></small></span></label>
          <label class="opt"><input type="radio" name="mode" value="pickup"><span><b data-i="pickup"></b><small data-i="pickupSub"></small></span></label>
        </div>
      </fieldset>

      <fieldset>
        <p class="step" data-i="s3"></p>
        <label class="f"><span data-i="name"></span><input type="text" id="name" autocomplete="name"></label>
        <label class="f"><span data-i="phone"></span><input type="tel" id="phone" autocomplete="tel" placeholder="012-345 6789"></label>
        <div id="addr">
          <label class="f"><span data-i="addr1"></span><input type="text" id="addr1" autocomplete="address-line1"></label>
          <label class="f"><span data-i="addr2"></span><input type="text" id="addr2" autocomplete="address-line2"></label>
          <div class="two">
            <label class="f"><span data-i="postcode"></span><input type="text" id="postcode" inputmode="numeric" maxlength="5" autocomplete="postal-code"></label>
            <label class="f"><span data-i="city"></span><input type="text" id="city" autocomplete="address-level2"></label>
          </div>
          <label class="f"><span data-i="state"></span>
            <select id="state" autocomplete="address-level1"></select></label>
        </div>
        <div class="two">
          <label class="f"><span data-i="date"></span><input type="date" id="date"></label>
          <label class="f"><span data-i="time"></span><input type="time" id="time" value="12:30"></label>
        </div>
        <label class="f"><span data-i="notes"></span><textarea id="notes"></textarea></label>
      </fieldset>

      <fieldset>
        <p class="step" data-i="s4"></p>
        <div class="opts" id="pays"></div>
      </fieldset>

      <p class="err" id="err" role="alert"></p>
      <button class="go" id="go" type="submit"></button>
      <p class="note" data-i="note"></p>
    </form>
    <div id="result"></div>
  </aside>
</main>

<footer><div class="wrap" data-i="foot"></div></footer>

  var c=calc();
  var feeTxt=mode()==="deliver"?(c.fee?rm(c.fee):t("free")):rm(0);
  $("#totals").innerHTML='<div class="row"><span>'+t("subtotal")+'</span><span>'+rm(c.sub)+'</span></div><div class="row"><span>'+t("fee")+'</span><span>'+(c.sub?feeTxt:rm(0))+'</span></div><div class="row grand"><span>'+t("total")+'</span><span>'+rm(c.total)+'</span></div>';
  updateGo();
}
function renderPays(){
  var chosen=document.querySelector('input[name="pay"]:checked'); var keep=chosen?chosen.value:"duitnow";
  $("#pays").innerHTML=PAYS.map(function(p){return '<label class="opt"><input type="radio" name="pay" value="'+p.id+'"'+(p.id===keep?" checked":"")+'><span><b>'+p[lang]+'</b><small>'+p["s_"+lang]+'</small></span></label>'}).join("");
  updateGo();
}
function renderStates(){
  var v=$("#state").value;
  $("#state").innerHTML=STATES.map(function(s){return '<option>'+s+'</option>'}).join(""); $("#state").value=v||"Kelantan";
}
function updateMode(){ $("#addr").hidden=mode()!=="deliver"; renderCart(); }
function updateGo(){
  var p=document.querySelector('input[name="pay"]:checked');
  $("#go").textContent=(p&&p.value==="cod")?t("go"):t("goPay");
}
function todayStr(){var d=new Date();var m=("0"+(d.getMonth()+1)).slice(-2),dd=("0"+d.getDate()).slice(-2);return d.getFullYear()+"-"+m+"-"+dd}

document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.c){cat=b.dataset.c;renderCats();renderMenu();return}
  if(b.dataset.id){var id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.d));if(!cart[id])delete cart[id];renderMenu();renderCart();var f=document.querySelector('[data-id="'+id+'"]');if(f)f.focus()}
});
$("#l-ms").onclick=function(){lang="ms";try{localStorage.setItem("nbm-lang",lang)}catch(e){}applyI18n()};
$("#l-en").onclick=function(){lang="en";try{localStorage.setItem("nbm-lang",lang)}catch(e){}applyI18n()};
document.querySelectorAll('input[name="mode"]').forEach(function(r){r.addEventListener("change",updateMode)});
document.addEventListener("change",function(e){if(e.target.name==="pay")updateGo()});
$("#state").addEventListener("change",renderCart);

$("#form").addEventListener("submit",function(e){
  e.preventDefault();
  var err=function(k,extra){$("#err").textContent=t(k)+(extra||"");return false};
  var c=calc(), dl=mode()==="deliver";
  if(!c.sub) return err("eCart");
  if(c.sub<CONFIG.minOrder) return err("eMin",CONFIG.minOrder.toFixed(2));
  if(!$("#name").value.trim()) return err("eName");
  if(!/^(\+?60|0)1\d{8,9}$|^0\d{8,9}$/.test($("#phone").value.replace(/[\s-]/g,""))) return err("ePhone");
  if(dl&&(!$("#addr1").value.trim()||!/^\d{5}$/.test($("#postcode").value.trim())||!$("#city").value.trim())) return err("eAddr");
  if(!$("#date").value||$("#date").value<todayStr()) return err("eDate");
  $("#err").textContent="";
  var pay=document.querySelector('input[name="pay"]:checked').value;
  var payObj=PAYS.filter(function(p){return p.id===pay})[0];
  var no="NBM-"+Date.now().toString(36).toUpperCase().slice(-6);
  var L=[ "Tempahan / Order "+no, "" ];
  MENU.forEach(function(m){if(cart[m.id])L.push(cart[m.id]+" x "+m.ms+" ("+m.en+") - "+rm(cart[m.id]*m.p))});
  L.push("", t("subtotal")+": "+rm(c.sub), t("fee")+": "+rm(c.fee), t("total")+": "+rm(c.total), "");
  L.push((dl?t("deliver"):t("pickup")));
  L.push($("#name").value.trim()+" / "+$("#phone").value.trim());
  if(dl) L.push([$("#addr1").value.trim(),$("#addr2").value.trim(),$("#postcode").value.trim()+" "+$("#city").value.trim(),$("#state").value].filter(Boolean).join(", "));
  L.push($("#date").value+" "+$("#time").value);
  if($("#notes").value.trim()) L.push(t("notes").split(" (")[0]+": "+$("#notes").value.trim());
  L.push(payObj[lang]+" - "+(pay==="cod"?t("status_cod"):t("status_paid")));
  cur=L.join("\n");
  var wa=CONFIG.whatsapp?'<a href="https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(cur)+'" target="_blank" rel="noopener">'+t("wa")+'</a>':"";
  var payBox="";
  if(pay==="duitnow"){
    var qr=CONFIG.qr?'<img src="'+CONFIG.qr+'" alt="'+t("qrAlt")+'" class="qr">':'<div class="qr ph">'+t("noQr")+'</div>';
    payBox='<div class="paybox"><h3>'+t("payH")+'</h3>'+qr+'<div class="amt"><span>'+t("payAmt")+'</span><b>'+rm(c.total)+'</b></div><div class="amt"><span>'+t("payTo")+'</span><b>'+CONFIG.payName+'</b></div><ol><li>'+t("payS1")+'</li><li>'+t("payS2")+'</li><li>'+t("payS3")+'</li></ol><div class="amt"><span>'+t("rcpt")+'</span><b>+'+CONFIG.whatsapp+'<br>'+CONFIG.email+'</b></div></div>';
  }
  $("#result").innerHTML='<div class="done"><h3>'+t("doneH")+" "+no+'</h3>'+payBox+'<div>'+t("doneP")+'</div><pre id="sum"></pre><div class="acts"><button type="button" id="cp">'+t("copy")+'</button>'+wa+'<button type="button" id="nw">'+t("newo")+'</button></div></div>';
  $("#sum").textContent=cur;
  $("#cp").onclick=function(){var b=this;function ok(){b.textContent=t("copied")}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cur).then(ok,function(){var r=document.createRange();r.selectNodeContents($("#sum"));var s=getSelection();s.removeAllRanges();s.addRange(r)})}
    else{var r=document.createRange();r.selectNodeContents($("#sum"));var s=getSelection();s.removeAllRanges();s.addRange(r)}};
  $("#nw").onclick=function(){cart={};$("#result").innerHTML="";renderMenu();renderCart()};
  $("#result").scrollIntoView({block:"nearest"});
});

$("#date").value=todayStr(); $("#date").min=todayStr();
/* Contoh pesanan supaya panel nampak berfungsi */
cart={percik:2,pedas:1};
applyI18n();
</script>
